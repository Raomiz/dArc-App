# Analyze, test, and produce a sideload debug APK.
# No Play store, no signing secrets, no live API keys.
name: Flutter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-apk:
    name: analyze, test, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug

      - name: Upload o-debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: o-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
