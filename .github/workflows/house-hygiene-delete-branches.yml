name: house-hygiene-delete-branches
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete house hygiene leftovers and self-remove workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targets = ['house/hygiene-delete-branches'];
            const deleted = [];
            const errors = [];
            for (const name of targets) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push(name);
              } catch (e) {
                errors.push({ name, error: e.message || String(e) });
              }
            }
            try {
              const wf = await github.rest.repos.getContent({
                owner, repo, path: '.github/workflows/house-hygiene-delete-branches.yml', ref: 'main',
              });
              await github.rest.repos.deleteFile({
                owner, repo,
                path: '.github/workflows/house-hygiene-delete-branches.yml',
                message: 'chore(house): remove one-shot branch hygiene workflow',
                sha: wf.data.sha, branch: 'main',
              });
              deleted.push('.github/workflows/house-hygiene-delete-branches.yml');
            } catch (e) {
              errors.push({ name: 'workflow-file', error: e.message || String(e) });
            }
            console.log(JSON.stringify({ deleted, errors }));
